name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Playwright is installed only in CI (not a project dependency).
      - run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: node test/e2e.mjs
